name: Release

on:
  push:
    branches:
      - master
  # 手动重发入口：workflow 刚启用、或上次推送在启用之前时，不必再造一个空提交。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # 续作仓库自己发版。上游 YuJunZhiXue/dsh-purge 的 tag 已全部同步到本仓库，
    # 更新链路（codeload refs/heads 与 refs/tags）也只认本仓库。
    if: github.repository == 'Fire-Phoenixs/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check every JS/MJS file
        run: |
          # 全量语法检查：不只入口三个文件 —— 改动 update.js / redteam / client.js
          # 曾绕过了原来的检查。
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find lib scripts tests bin -type f \( -name '*.js' -o -name '*.mjs' \))
          node --check client.js || fail=1
          exit $fail

      - name: Load plugin entry
        run: node --input-type=module -e "import './lib/index.js'"

      - name: Regression tests
        run: node scripts/run-tests.mjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "already published: $tag"
            exit 0
          fi
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          zip="dsh-purge-${version}.zip"
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            commit="$(git rev-parse "refs/tags/${tag}^{}")"
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" "$commit"
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          else
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md)
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
          fi
          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/Fire-Phoenixs/dsh-purge/releases/tag/${tag}"
